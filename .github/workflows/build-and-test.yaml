name: Build and Test
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # clone repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # install dependencies
      - name: Install dependencies
        run: |
          sudo apt-get update 
          sudo apt-get install -y \
          autoconf \
          libtool \
          libid3-dev \
          libtag1-dev \
          libflac-dev \
          libflac++-dev \
          libboost-filesystem-dev \
          libboost-timer-dev \
          libboost-system-dev \
          gcc \
          g++ \
          libboost-chrono-dev 

      # execute build script
      - name: Build project
        run: |
          ./autogen.sh
          ./configure
          make

      # execute test script
      - name: Run tests
        run: |
          chmod +x ./test/test.sh
          ./test/test.sh
